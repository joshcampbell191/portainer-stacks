version: 2
updates:
  - package-ecosystem: "docker-compose"
    directories: 
      - "/airconnect/"
      - "/pihole/"
      - "/plex/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/portainer"
    schedule:
      interval: "weekly"
    groups:
      portainer-compose:
        patterns:
          - "*"
